[project]
name = "smartcamera-trt"
version = "0.1.0"
description = "Qwen3-VL-8B on TensorRT for Windows / Blackwell sm_120."
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy==2.1.2",
    "Pillow==11.0.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.1",
    "accelerate==1.10.1",
    "safetensors==0.6.2",
    "huggingface_hub==0.35.3",
    "onnx==1.19.0",
    "onnxscript==0.5.4",
    "tensorrt-cu12>=10.13,<10.14",
    "cuda-python>=12.9,<13",
    "polygraphy>=0.49",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
